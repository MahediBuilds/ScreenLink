<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>ScreenLink</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

<div class="container">

    <header>

        <h1>ScreenLink</h1>

        <p id="phoneInfo">
            Loading phone information...
        </p>

    </header>


    <section>

        <div class="section-header">

            <h2>Connected Laptop</h2>

        </div>

        <div id="device">

            <p class="muted">
                Waiting for laptop...
            </p>

        </div>

    </section>


    <section>

        <h2>Type Text</h2>

        <textarea
            id="typeText"
            placeholder="Enter text to type on the laptop..."
            rows="8"
        ></textarea>

        <div class="typing-buttons">

            <button
                id="typeButton"
                onclick="sendTyping()"
                disabled
            >
                Type on Laptop
            </button>

            <button
                id="stopButton"
                onclick="stopTyping()"
                disabled
            >
                Stop Typing
            </button>

        </div>

        <p id="typeResult"></p>

    </section>

</div>


<script
    src="{{ url_for('static', filename='js/app.js') }}"
></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ScreenLink</title>

    <link
        rel="stylesheet"
        href="/static/css/style.css?v=3"
    >

</head>


<body>

<div class="app">

    <header class="header">

        <div>

            <h1>ScreenLink</h1>

            <p id="connectionText">
                Connecting...
            </p>

        </div>

        <div
            id="connectionIndicator"
            class="connection-indicator connecting"
        >

            <span class="indicator-dot"></span>

            <span id="connectionStatus">
                Connecting
            </span>

        </div>

    </header>


    <!-- =============================== -->
    <!-- CONNECTING VIEW                  -->
    <!-- =============================== -->

    <main
        id="connectingView"
        class="view connecting-view"
    >

        <div class="loader"></div>

        <h2>
            Connecting to laptop
        </h2>

        <p>
            Waiting for your laptop to register...
        </p>

    </main>


    <!-- =============================== -->
    <!-- CONTROL VIEW                     -->
    <!-- =============================== -->

    <main
        id="controlView"
        class="view hidden"
    >

        <!-- SCREENSHOT -->

        <section class="section">

            <div class="section-header">

                <div>

                    <h2>
                        Screen
                    </h2>

                    <p
                        id="deviceInfo"
                        class="muted"
                    ></p>

                </div>

                <button
                    id="screenshotButton"
                    class="primary-button"
                    onclick="takeScreenshot()"
                >
                    Take Screenshot
                </button>

            </div>


            <div
                id="screenshotContainer"
                class="screenshot-container"
            >

                <div class="empty-state">

                    <p>
                        No screenshot captured yet.
                    </p>

                    <p class="muted">
                        Press "Take Screenshot".
                    </p>

                </div>

            </div>


            <!-- AI CLICK CONTROL -->

            <div
                id="aiClickSection"
                class="ai-click-section hidden"
            >

                <h3>
                    Execute ChatGPT Clicks
                </h3>

                <p class="muted">
                    Give the screenshot to ChatGPT,
                    then paste its normalized JSON here.
                </p>


                <textarea
                    id="clickJson"
                    class="click-json"
                    placeholder='{
  "steps": [
    {
      "action": "click",
      "target": "Java",
      "confidence": 0.99,
      "point": {
        "x": 366,
        "y": 347
      }
    }
  ]
}'
                    rows="10"
                ></textarea>


                <button
                    id="executeClickButton"
                    class="primary-button"
                    onclick="executeClicks()"
                >
                    Execute Clicks
                </button>


                <p
                    id="clickResult"
                    class="result"
                ></p>

            </div>

        </section>


        <!-- TYPING -->

        <section class="section">

            <h2>
                Typing
            </h2>


            <textarea
                id="typeText"
                class="type-text"
                placeholder="Enter text to type on the laptop..."
                rows="6"
            ></textarea>


            <div class="typing-buttons">

                <button
                    id="typeButton"
                    class="primary-button"
                    onclick="startTyping()"
                >
                    Start Typing
                </button>


                <button
                    id="stopButton"
                    class="secondary-button"
                    onclick="stopTyping()"
                    disabled
                >
                    Stop Typing
                </button>

            </div>


            <p
                id="typeResult"
                class="result"
            ></p>

        </section>

    </main>

</div>


<script
    src="/static/js/app.js?v=3"
></script>

</body>

</html>

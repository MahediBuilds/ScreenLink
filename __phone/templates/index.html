<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>ScreenLink</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

<div class="app">

    <header class="header">

        <div class="logo">
            ScreenLink
        </div>

        <div
            id="connectionStatus"
            class="connection-status connecting"
        >
            <span class="status-dot"></span>
            <span id="connectionText">
                Connecting...
            </span>
        </div>

    </header>


    <main>

        <section
            id="connectingView"
            class="connecting-view"
        >

            <div class="loader"></div>

            <h1>
                Connecting to laptop
            </h1>

            <p>
                Waiting for your laptop to register...
            </p>

        </section>


        <section
            id="controlView"
            class="control-view hidden"
        >

            <div class="action-card">

                <h2>
                    Remote Control
                </h2>

                <p class="section-description">
                    Control your connected laptop from your phone.
                </p>


                <button
                    id="screenshotButton"
                    class="primary-button screenshot-button"
                    onclick="takeScreenshot()"
                >

                    <span>
                        Take Screenshot
                    </span>

                </button>


                <div
                    id="screenshotResult"
                    class="screenshot-result"
                ></div>

            </div>


            <div class="action-card">

                <h2>
                    Type Text
                </h2>

                <p class="section-description">
                    Enter text to type on the laptop.
                </p>


                <textarea
                    id="typeText"
                    placeholder="Enter text to type..."
                    rows="8"
                ></textarea>


                <div class="typing-buttons">

                    <button
                        id="typeButton"
                        class="primary-button"
                        onclick="sendTyping()"
                    >
                        Start Typing
                    </button>

                    <button
                        id="stopButton"
                        class="secondary-button"
                        onclick="stopTyping()"
                        disabled
                    >
                        Stop Typing
                    </button>

                </div>


                <p
                    id="typeResult"
                    class="result"
                ></p>

            </div>

        </section>

    </main>

</div>


<script
    src="{{ url_for('static', filename='js/app.js') }}"
></script>

</body>

</html>
